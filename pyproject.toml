[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "adapter-subgroup-analysis"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torchvision",
    "transformers",
    "numpy",
    "pandas",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "seaborn",
    "Pillow",
    "tqdm",
    "wandb",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["training*", "evaluation*"]
